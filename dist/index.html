<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anirudh Kamath</title>
<meta name="description" content="Anirudh Kamath. SF, often NYC. Agent identity at arcade.dev; before that Smithery, Stagehand at Browserbase, Whatnot.">
<style>
  @font-face { font-family: "Notebook Hand"; src: url("NotebookHand-Regular.otf") format("opentype"); font-display: block; }
  :root { --paper: #f4efe4; --grid: #dbd3c1; --ink: #1c1b22; --link: #1d4ed8; }
  html { background: var(--paper); }
  body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Notebook Hand", "Segoe Print", "Bradley Hand", cursive; }
  /* The rules are drawn by the page from the same cell size and origin the layout snaps to. */
  .page {
    position: relative; width: 100%; min-height: 100vh; box-sizing: border-box; --cell: 30px; --origin: 30px;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    background-position: var(--origin) var(--origin);
  }
  .note { position: absolute; transform: translate(var(--dx, 0), var(--dy, 0)) rotate(var(--rot, 0)); transform-origin: 20% 10%; }
  .note svg { display: block; overflow: visible; }
  .note svg text { fill: var(--ink); white-space: pre; }
  .note svg a { cursor: pointer; }
  .note svg a:hover text, .note svg a:focus-visible text { fill: var(--link); }
  .note svg a:hover ~ .doodles { color: var(--link); }
  .hint { position: fixed; left: 14px; bottom: 12px; padding: 4px 8px; border-radius: 4px; background: var(--paper); box-shadow: 0 0 0 1px var(--grid); font: 12px/1.3 system-ui, sans-serif; color: #8b7d66; letter-spacing: .04em; }
  .hint a { color: var(--link); text-decoration: underline; }
  @media (prefers-reduced-motion: no-preference) { .note { transition: left .25s ease, top .25s ease; } }
</style>
<main class="page" id="page"></main>
<div class="hint">laid out with <a href="http://pretextjs.dev/" target="_blank" rel="noopener">pretext</a> (try resizing me!)</div>
<script type="module" src="site.js"></script>
</html>
